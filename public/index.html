<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Forwarder Test Client</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }
      .test-section {
        margin: 20px 0;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .button {
        display: inline-block;
        padding: 10px 20px;
        margin: 5px;
        background: #007cba;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }
      .button:hover {
        background: #005a87;
      }
      .response {
        background: #f5f5f5;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        white-space: pre-wrap;
        font-family: monospace;
      }
      .error {
        background: #ffebee;
        color: #c62828;
      }
      .success {
        background: #e8f5e8;
        color: #2e7d32;
      }
    </style>
  </head>
  <body>
    <h1>Auth Forwarder Test Client</h1>

    <div class="test-section">
      <h2>1. Basic Tests</h2>
      <a href="/health" class="button" target="_blank">Health Check</a>
      <button onclick="testEndpoint('/auth')" class="button">
        Test Auth Endpoint
      </button>
      <button onclick="testEndpoint('/auth/verify')" class="button">
        Test Auth Verify
      </button>
      <button onclick="testEndpoint('/profile')" class="button">
        Test Profile
      </button>
    </div>

    <div class="test-section">
      <h2>2. Authentication Flow</h2>
      <a href="/login" class="button">Login (Logto)</a>
      <a href="/logout" class="button">Logout</a>
      <a href="/profile" class="button" target="_blank">View Profile</a>
    </div>

    <div class="test-section">
      <h2>3. Response</h2>
      <div id="response" class="response">
        Click a test button to see response...
      </div>
    </div>

    <script>
      async function testEndpoint(endpoint) {
        const responseDiv = document.getElementById('response')
        responseDiv.textContent = 'Testing ' + endpoint + '...'
        responseDiv.className = 'response'

        try {
          const response = await fetch(endpoint, {
            credentials: 'include', // Include cookies for session
          })

          const headers = {}
          response.headers.forEach((value, key) => {
            headers[key] = value
          })

          let body
          const contentType = response.headers.get('content-type')
          if (contentType && contentType.includes('application/json')) {
            body = await response.json()
          } else {
            body = await response.text()
          }

          const result = {
            status: response.status,
            statusText: response.statusText,
            headers: headers,
            body: body,
          }

          responseDiv.textContent = JSON.stringify(result, null, 2)
          responseDiv.className = response.ok
            ? 'response success'
            : 'response error'
        } catch (error) {
          responseDiv.textContent = 'Error: ' + error.message
          responseDiv.className = 'response error'
        }
      }

      // Auto-test health check on load
      window.onload = () => testEndpoint('/health')
    </script>
  </body>
</html>
